name: Fetch promo images

# The daily refresh routine runs in a sandbox that cannot download images, so it
# only records an "imageUrl" per item in data.json. This workflow does the actual
# downloading after each push, then commits the resized images back to main.
on:
  push:
    branches: [main]
    paths: [data.json]
  workflow_dispatch:

concurrency:
  group: fetch-images
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install Pillow

      - name: Download images referenced by imageUrl
        run: python3 fetch_images.py

      - name: Commit images back to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json images/
          if git diff --cached --quiet; then
            echo "No new images."
            exit 0
          fi
          git commit -m "fetch images [skip ci]"
          git pull --rebase origin main
          git push origin main
